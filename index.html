<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jester Tom's Service</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page-container">
    <div class="image-wrapper">

      <img
        id="page-image"
        class="page-background"
        src="assets/morning/Morning greetings page.png"
        alt="Jester Tom's Service"
      >

      <button
        id="get-started"
        class="image-hotspot"
        onclick="showWheel()"
        aria-label="Get Started"
      ></button>

      <button
  id="page-back"
  class="wheel-click back"
  onclick="backToWheel()"
  aria-label="Back to selection wheel"
  hidden
></button>
<div id="booking-form" hidden>
  <div class="booking-card">
    <h2 id="booking-title">Choose a date</h2>

    <div class="booking-navigation">
      <button type="button" onclick="changeBookingMonth(-1)">‹</button>

      <select id="booking-month" aria-label="Month"></select>
      <select id="booking-year" aria-label="Year"></select>

      <button type="button" onclick="changeBookingMonth(1)">›</button>
    </div>

    <div id="booking-calendar" class="booking-calendar"></div>

    <label for="booking-comments">Any suggestions?</label>
    <textarea
      id="booking-comments"
      maxlength="200"
      rows="3"
      placeholder="Anywhere you've wanted to go?"
    ></textarea>

    <div id="booking-count">0/200</div>

    <button
      id="booking-confirm"
      type="button"
      onclick="submitBooking()"
      disabled
    >
      Confirm →
    </button>
  </div>
</div>

<!-- Booking confirmation details -->
<div id="confirmation-details" hidden>
  <div class="confirmation-info">
    <div>
      <strong>📅 Date:</strong>
      <span id="confirmed-date"></span>
    </div>

    <div>
      <strong>🌸 Category:</strong>
      <span id="confirmed-category"></span>
    </div>
  </div>
</div>

<!-- Back to Home button -->
<button
  id="confirmation-home"
  type="button"
  onclick="confirmationHome()"
  aria-label="Back to Home"
  hidden
></button>

<div id="wheel-controls" hidden>

        <div class="wheel-window">
          <div id="wheel-track"></div>
        </div>

        <button class="wheel-click up"
                onclick="moveWheel(-1)"
                aria-label="Scroll up"></button>

        <button class="wheel-click down"
                onclick="moveWheel(1)"
                aria-label="Scroll down"></button>

        <button class="wheel-click surprise"
                onclick="surpriseMe()"
                aria-label="Surprise me"></button>

        <button class="wheel-click confirm"
                onclick="confirmSelection()"
                aria-label="Confirm"></button>

        <button class="wheel-click back"
                onclick="goBack()"
                aria-label="Back"></button>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
